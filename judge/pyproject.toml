[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-judge"
version = "0.1.0"
description = "Shared blind LLM-as-a-Judge for steering ablations"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
hybrid-judge = "hybrid_judge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

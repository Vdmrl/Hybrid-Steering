config_version: "1.0.0"

provider: "openrouter"
model: "deepseek/deepseek-v4-flash"
base_url: "https://openrouter.ai/api/v1"

generation:
  temperature: 0
  max_output_tokens: 4096
  timeout_seconds: 240
  max_retries: 4
  workers: 8

evaluation:
  default_feature: "optimism"
  scalar_prompt: "scalar_v1.txt"
  pairwise_prompt: "pairwise_v1.txt"

scale:
  minimum: 0
  maximum: 4
  anchors:
    0: "Clear expression of the opposite pole; target is absent."
    1: "Mostly the opposite pole, with weak or incidental target evidence."
    2: "Mixed, neutral, ambiguous, or balanced between both poles."
    3: "Clear target expression with minor inconsistency."
    4: "Strong and consistent target expression throughout the answer."

quality_metrics:
  - "task_correctness"
  - "coherence"
  - "content_preservation"

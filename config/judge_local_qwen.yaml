# Self-hosted OpenAI-compatible judge (vLLM). Kept beside the shared default so
# a local sweep never edits judge.yaml. Qwen3.8 emits reasoning by default and
# would spend the 4-token budget before the digit, so thinking is disabled and
# the digit is the first sampled token.
model: "Qwen/Qwen3.8-27B"
base_url: "http://100.113.188.115:8201/v1"

generation:
  temperature: 0
  max_output_tokens: 256
  top_logprobs: 20
  timeout_seconds: 240
  retries: 2
  workers: 8
  request_extras:
    chat_template_kwargs:
      enable_thinking: false

evaluation:
  default_feature: "optimism"
  prompt: "judge_v3_compositional.txt"

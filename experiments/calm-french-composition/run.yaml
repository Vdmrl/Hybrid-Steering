experiment: calm-french-composition
model: Qwen/Qwen3.5-9B
gpu: 3
seed: 20260728

directions:
  donors_per_direction: 64
  layers: all_gdn
  calm:
    positive: calm_composure
    negative: fear_panic
    alpha: 2.0
  french:
    positive: french_translation
    negative: multilingual_source
    source_languages:
      English: 13
      German: 13
      Spanish: 13
      Russian: 13
      Mandarin Chinese: 12
    alpha_grid: [1.0, 2.0, 4.0]

validation:
  prompts: 64
  conditions: [baseline, calm, french, calm_french]
  max_new_tokens: 128

evaluation:
  judge_version: v2
  judge_config: ../../judge/config/judge.yaml
  comparisons:
    calm_single: [baseline, calm]
    calm_with_french: [french, calm_french]
    french_single: [baseline, french]
    french_with_calm: [calm, calm_french]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdn-interp"
version = "0.1.0"
description = "GDN recurrent-state collection, steering and concept detection for Qwen"
readme = "README.md"
# nnsight's tracing of the GDN kernels is exercised on 3.12; judge/ and steering/
# stay at >=3.11 because they do not depend on it.
requires-python = ">=3.12"
dependencies = [
  "accelerate",
  "datasets",
  "duckdb",
  "jaxtyping>=0.3.11",
  "lingua-language-detector>=2.2.0",
  "litellm",
  "nnsight>=0.7.0",
  "numpy>=2.2.6",
  "pandas",
  "pyarrow",
  "torch==2.7.1",
  "transformers==5.14.1",
]

[project.optional-dependencies]
# Fused kernels. causal-conv1d ships as a CUDA-specific wheel and resolves only
# from the astral cu126 index declared in the workspace pyproject.toml, so it is
# optional here: the package imports and the unit tests run without it.
fast-kernels = [
  "causal-conv1d==1.6.2.post1+cu.12.6.torch.2.7",
  "flash-linear-attention",
]
plots = [
  "plotly",
  "pillow",
]
notebooks = [
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.9",
  "nbformat>=5.11.1",
]
toy-models = [
  "trainer-tools>=0.5,<0.6",
  "transformer-lens>=3,<4",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gdn_interp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

features:
  answer_quality:
    guide: |
      Target: a response that fulfills the request correctly and coherently.
      Look for the asked substance, including important supplied facts and constraints.
      Verbosity, confidence, or politeness alone are insufficient. Incoherence or style in place of the asked content is not this concept.

  principled_candor:
    guide: |
      Target: principled candor, an evidence-based position kept under social pressure.
      Look for a respectful refusal to drop the evidence in order to please.
      Rudeness, automatic disagreement, or ordinary politeness alone are insufficient. Agreeing with a correct statement is not this concept.

  calm_composure:
    guide: |
      Target: calm composure under real stakes.
      Look for a clear, proportionate response that recognizes the stakes without catastrophizing.
      Apathy, denial of a real risk, or urgency alone are insufficient. A serious topic is not panic by itself.

  concrete_language:
    guide: |
      Target: concrete, situation-specific language a reader could act on.
      Look for observable or operational detail tied to this case.
      Length, one vague example, or a general principle without a usable detail are insufficient.

  casualness:
    guide: |
      Target: a casual, conversational register.
      Look for ordinary relaxed phrasing sustained through the answer.
      Slang piled on, rudeness, carelessness, or one informal word in an otherwise official answer are insufficient.

  optimism:
    guide: |
      Target: optimism about plausible favorable outcomes.
      Look for weight given to realistic improvement while risk and uncertainty stay visible.
      Guaranteed success, generic cheerleading, or an isolated "hopefully" are insufficient. A positive topic with no favorable possibility does not count.

  joy:
    guide: |
      Target: expressed joy, delight, or warm positive emotion about the present situation.
      Look for sustained gladness in the assistant's own voice.
      Politeness, a positive forecast, or an isolated "great" or exclamation mark alone are insufficient.

  first_person_voice:
    guide: |
      Target: a sustained first-person voice, I or we, as the answer's own perspective.
      Look for first-person reference carrying the substantive content.
      An isolated quotation, a single "I", or instructions addressed as "you" alone are insufficient.

  bulleted_layout:
    guide: |
      Target: a bulleted or itemized layout that holds the substantive answer.
      Look for several distinct bullet items carrying the content.
      A heading, one marker, or a quoted list alone are insufficient.

  technical_language:
    guide: |
      Target: technical language that names the mechanism, not only the topic.
      Look for accurate subject-matter terms used together with an explanation of how the thing works.
      An everyday explanation, a product name, isolated jargon, or a string of numbers alone are insufficient.

  probabilistic_framing:
    guide: |
      Target: probabilistic framing of outcomes.
      Look for graded likelihoods, admitted alternatives, or claims conditioned on uncertainty.
      Polite hedging such as "perhaps I can help", or confidence about a settled fact, is insufficient.

  comparative_framing:
    guide: |
      Target: comparative framing.
      Look for an explicit contrast between the subject and another option, a baseline, or an earlier state.
      A list of items, or the word "better" without a named reference point, is insufficient.

  fairytale:
    guide: |
      Target: a sustained fairy-tale storytelling style in the answer's own voice.
      Look for a storybook narrator, fairy-tale phrasing, and evocative imagery carried through the response.
      One decorative opening, a quoted fairy tale, or fiction that drops the requested substance is insufficient.

  fictional_narrative:
    guide: |
      Target: a fictional narrative voice.
      Look for invented events told with story framing such as a scene, characters, or a plot.
      Vivid wording inside a factual report is insufficient. Magic or a finished plot is not required.

  theistic_framing:
    guide: |
      Target: theistic framing, the answer's own premise that a divine being acts, guides, or gives meaning.
      Look for reasoning that depends on that premise.
      A neutral description of what believers think, or an idiom such as "thank God", is insufficient.

  numbered:
    guide: |
      Target: a response organized as a numbered list, with consecutive numeric labels
      such as "1.", "2.", and "3." introducing substantive items. The numbering
      should structure the answer rather than appear only in a quotation, example,
      or isolated phrase. Bullet lists without numeric labels, a single numbered
      item, and numbers used only as quantities are insufficient.
